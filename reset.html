<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パスワードの再設定 | TacLog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
</head>
<body>
<header id="topbar"></header>
<main id="main" class="wrap narrow" style="max-width:480px">
  <section class="card">
    <h1>新しいパスワード</h1>
    <p class="muted small" id="sub">新しいパスワードを決めてください。</p>
    <form id="form" style="display:grid;gap:14px" hidden>
      <label for="p1">新しいパスワード<input id="p1" type="password" required minlength="8" autocomplete="new-password" placeholder="8文字以上"></label>
      <label for="p2">もう一度<input id="p2" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn primary" type="submit" id="submit">パスワードを変える</button>
    </form>
    <div id="msg" hidden></div>
    <p class="small muted"><a href="/login">ログインに戻る</a></p>
  </section>
</main>
<footer id="footer"></footer>
<script>
TL.header([{href:"/pricing",label:"料金"}]);TL.footer();
const msg=(t,ok)=>{const m=TL.$("msg");m.hidden=false;m.className=ok?"ok":"notice";m.textContent=t};
let ready=false;
const show=()=>{if(ready)return;ready=true;TL.$("form").hidden=false};
if(!TL.sb){TL.notConfigured()}
else{
  // The link in the email signs the person in for this one purpose; then they can set a new password.
  TL.sb.auth.onAuthStateChange((ev,session)=>{if(session)show()});
  TL.session().then(s=>{if(s)show()});
  const err=new URLSearchParams(location.hash.slice(1)).get("error_description")||new URLSearchParams(location.search).get("error_description");
  setTimeout(()=>{if(!ready)msg(err?"このリンクは使えません(期限切れか、すでに使われています)。ログイン画面の「パスワードを忘れた方」から、もう一度送ってください。":"メールのリンクから開いてください。リンクの期限が切れている場合は、ログイン画面の「パスワードを忘れた方」から、もう一度送ってください。")},2500);
}
TL.$("form").addEventListener("submit",async e=>{
  e.preventDefault();const b=TL.$("submit");
  if(TL.$("p1").value!==TL.$("p2").value){msg("2つのパスワードが違います。");return}
  b.disabled=true;
  try{const{error}=await TL.sb.auth.updateUser({password:TL.$("p1").value});if(error)throw error;
    msg("パスワードを変えました。アプリに移動します…",true);setTimeout(()=>location.href="/app",1200)}
  catch(err){msg(TL.errText(err))}finally{b.disabled=false}
});
</script>
</body>
</html>
