<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>無料登録 | TacLog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/common.js"></script>
</head>
<body>
<header id="topbar"></header>
<main id="main" class="wrap narrow" style="max-width:480px">
  <section class="card">
    <h1 id="title">ログイン</h1>
    <p class="muted small" id="sub">TacLogのアカウントでログインしてください。</p>
    <button class="btn" type="button" id="google">Googleで続ける</button>
    <div class="row muted small" style="justify-content:center">または</div>
    <form id="form" style="display:grid;gap:14px">
      <label for="email">メールアドレス<input id="email" type="email" required autocomplete="email"></label>
      <label for="password">パスワード<input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="8文字以上"></label>
      <button class="btn primary" type="submit" id="submit">ログイン</button>
    </form>
    <div id="msg" hidden></div>
    <p class="small muted" id="switch">アカウントがない方は <a href="/signup">無料で登録</a></p>
  </section>
</main>
<footer id="footer"></footer>
<!-- signup.html is a copy of login.html; keep them in sync -->
<script>
const isSignup=location.pathname.startsWith("/signup");
const params=new URLSearchParams(location.search);
const next=params.get("next")&&params.get("next").startsWith("/")?params.get("next"):"/app";
TL.header([{href:"/pricing",label:"料金"}]);TL.footer();
if(isSignup){document.title="無料登録 | TacLog";TL.$("title").textContent="アカウントを作る";TL.$("sub").textContent="無料で始められます。クレジットカードの登録は不要です。";TL.$("submit").textContent="アカウントを作る";TL.$("password").autocomplete="new-password";TL.$("switch").innerHTML='すでにアカウントがある方は <a href="/login">ログイン</a>'}
if(params.get("next")){TL.$("switch").querySelector("a").href+= "?next="+encodeURIComponent(next)}
const msg=(t,ok)=>{const m=TL.$("msg");m.hidden=false;m.className=ok?"ok":"notice";m.textContent=t};
if(!TL.sb){TL.notConfigured();TL.$("submit").disabled=true;TL.$("google").disabled=true}
TL.session().then(s=>{if(s)location.href=next});
TL.$("google").onclick=async()=>{const{error}=await TL.sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+next}});if(error)msg(TL.errText(error))};
TL.$("form").addEventListener("submit",async e=>{
  e.preventDefault();const b=TL.$("submit");b.disabled=true;
  const email=TL.$("email").value.trim(),password=TL.$("password").value;
  try{
    if(isSignup){const{data,error}=await TL.sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+next}});if(error)throw error;
      if(data.session){location.href=next}else{msg("確認メールを送りました。メールのリンクを開くと登録が完了します。",true)}}
    else{const{error}=await TL.sb.auth.signInWithPassword({email,password});if(error)throw error;location.href=next}
  }catch(err){msg(TL.errText(err))}finally{b.disabled=false}
});
</script>
</body>
</html>
